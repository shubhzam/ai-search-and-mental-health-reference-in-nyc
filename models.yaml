# exact provider api model ids the study calls, and the dates each one may be called (inclusive).
# ids and lifecycle dates checked against the provider docs on 2026-11-05:
#   anthropic: platform.claude.com/docs/en/about-claude/models/overview and /model-deprecations
#   openai:    developers.openai.com/api/docs/models/all and /deprecations
#   gemini:    ai.google.dev/gemini-api/docs/models and /deprecations
# active_from covers the 2026-11-07 pilot. active_until is the last day we call the model.
# web search support per model is not verified yet; the 2026-11-07 pilot checks it.
# one tier per family across four generations, rung 1 = oldest still served.

models:
  # anthropic, sonnet line
  - model_id: claude-sonnet-4-5-20250929
    provider: anthropic
    generation_rung: 1
    active_from: "2026-11-07"
    active_until: "2026-11-29"   # deprecated, retires 2026-11-30, so the last safe day is the 29th

  - model_id: claude-sonnet-4-6
    provider: anthropic
    generation_rung: 2
    active_from: "2026-11-07"
    active_until: "2026-12-20"

  - model_id: claude-sonnet-5
    provider: anthropic
    generation_rung: 3
    active_from: "2026-11-07"
    active_until: "2026-12-20"

  - model_id: claude-sonnet-5-5
    provider: anthropic
    generation_rung: 4
    active_from: "2026-11-07"
    active_until: "2026-12-20"

  # openai, gpt-4o era to gpt-6 era
  - model_id: gpt-4o-2024-08-06
    provider: openai
    generation_rung: 1
    active_from: "2026-11-07"
    active_until: "2026-12-20"   # deprecated, shuts down 2027-01-14

  - model_id: gpt-5.1-2025-11-13
    provider: openai
    generation_rung: 2
    active_from: "2026-11-07"
    active_until: "2026-12-20"   # deprecated, shuts down 2027-04-01

  - model_id: gpt-5.4
    provider: openai
    generation_rung: 3
    active_from: "2026-11-07"
    active_until: "2026-12-20"

  - model_id: gpt-6.1-sol
    provider: openai
    generation_rung: 4
    active_from: "2026-11-07"
    active_until: "2026-12-20"

  # gemini, flash line
  - model_id: gemini-2.5-flash
    provider: gemini
    generation_rung: 1
    active_from: "2026-11-07"
    active_until: "2026-12-20"   # only served to projects that used it before; delete this entry if our key can't list it

  - model_id: gemini-3-flash-preview
    provider: gemini
    generation_rung: 2
    active_from: "2026-11-07"
    active_until: "2026-12-20"   # preview with a named replacement, could be shut down early

  - model_id: gemini-3.6-flash
    provider: gemini
    generation_rung: 3
    active_from: "2026-11-07"
    active_until: "2026-12-20"

  - model_id: gemini-3.8-flash
    provider: gemini
    generation_rung: 4
    active_from: "2026-11-07"
    active_until: "2026-12-20"
